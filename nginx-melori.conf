# Melori Music Platform - Nginx Configuration
# Path on VPS: /etc/nginx/sites-available/melori

server {
    listen 80;
    server_name melorimusicplatform.com www.melorimusicplatform.com;  # Production domain

    # Increase buffer sizes for large file uploads and audio streaming
    client_max_body_size 500M;
    client_body_buffer_size 500M;
    client_body_timeout 600s;
    
    # Logging
    access_log /var/log/nginx/melori-access.log;
    error_log /var/log/nginx/melori-error.log;

    # Serve static assets from build output (CSS, JS, fonts)
    location /assets {
        alias /home/m6/melori_music/dist/public/assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # CORS for assets
        add_header Access-Control-Allow-Origin *;
    }

    # Serve uploaded files (audio, images)
    location /uploads {
        alias /home/m6/melori_music/public/uploads;
        
        # Audio streaming headers
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        
        # MIME types for audio files
        types {
            audio/mpeg mp3;
            audio/wav wav;
            audio/ogg ogg;
            audio/flac flac;
            audio/mp4 m4a;
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
        }
        
        # Cache headers for images
        location ~* \.(jpg|jpeg|png|gif|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Proxy API requests to Node backend
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Reverse proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for long requests (uploads, etc.)
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    # Root location - proxy everything else to Node (for SPA routing)
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Reverse proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;
}

